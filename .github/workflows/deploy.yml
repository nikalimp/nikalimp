# Выкладка nikalimp.ru (репозиторий nikalimp/nikalimp) — вызов общего сценария nikalimp/deploy-kit (стандарт «Публикация — стандарт»).
# Порядок: SSH (rsync) → если не прошёл, FTP → если упали оба, сборка в артефакте site-build.
# Значения with: повторяют publish.json. Сайт — папка .site; при сборке он читает справочники Library/* из этого же репозитория (публичный: минуты Actions бесплатные).
# Секреты репозитория: SSH_KEY (есть); FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR = www/nikalimp.ru/ — для запасного пути FTP;
# TELEGRAM_*, MAX_* — анонсы статей. Адрес сервера, пользователь и папка не секретны — заданы здесь.
name: Deploy nikalimp.ru
on:
  push:
    branches: [main]
    paths:
      - ".site/**"
      - "!.site/specs/**"
      - "Library/**"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "11 4 * * 1-5"   # очередь контент-завода: Пн–Пт 11:11 по Бангкоку
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  # Очередь: статья дня из плана (ready, дата ≤ сегодня) → блог. Пишет её субботняя задача «Неделя — все проекты».
  queue:
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/queue.yml@main
    with:
      config: .site/content/factory/content.config.json
  site:
    needs: queue
    if: github.event_name != 'schedule' || needs.queue.outputs.published == 'true'
    # без этой строки запуск падает со startup_failure: сценарий коммитит медиа обратно в репозиторий
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@main
    with:
      ref: main  # выкладывать main вместе с коммитом очереди
      adapter: ssh-ftp
      site_dir: ".site"
      out_dir: out
      url: https://nikalimp.ru
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      BUILD_ENV: ${{ secrets.BUILD_ENV }}  # устарел: удалить, когда заведён NEXT_PUBLIC_PSI_KEY
      NEXT_PUBLIC_PSI_KEY: ${{ secrets.NEXT_PUBLIC_PSI_KEY }}
      SSH_HOST: "31.31.197.26"
      SSH_USER: "u3672757"
      SITE_DIR: "/var/www/u3672757/data/www/nikalimp.ru/"
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
      NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
